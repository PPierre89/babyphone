# Services du babyphone sur le NAS.
#
#   docker compose --env-file .env up -d                     # signalisation + notifications
#   docker compose --env-file .env --profile remote up -d    # + relais TURN pour l'accès en 4G (phase 4)
#
# Seul Caddy publie des ports. Les autres services sont sur un réseau interne sans accès sortant.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"       # redirection HTTPS et validation Let's Encrypt
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SIGNALING_DOMAIN: ${SIGNALING_DOMAIN:?définir SIGNALING_DOMAIN dans .env}
      PUSH_DOMAIN: ${PUSH_DOMAIN:?définir PUSH_DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?définir ACME_EMAIL dans .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks:
      - edge
      - backend
    depends_on:
      signaling:
        condition: service_healthy

  signaling:
    <<: *hardening
    # Image publiée par la CI à chaque release (amd64 et arm64).
    # Pour compiler localement à la place : docker compose up -d --build
    image: ghcr.io/ppierre89/babyphone-signaling:${SIGNALING_VERSION:?définir SIGNALING_VERSION dans .env}
    build:
      context: ../server/signaling
      args:
        VERSION: ${SIGNALING_VERSION}
    environment:
      ALLOWED_FAMILIES: ${ALLOWED_FAMILIES:?définir ALLOWED_FAMILIES dans .env}
    networks:
      - backend
    mem_limit: 64m
    pids_limit: 64

  ntfy:
    <<: *hardening
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    environment:
      NTFY_BASE_URL: https://${PUSH_DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all   # aucun sujet lisible ni publiable sans compte
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_UPSTREAM_BASE_URL: ""
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks:
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:8080/v1/health | grep -q true"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Relais TURN, nécessaire seulement pour l'accès depuis la 4G (phase 4).
  # Il doit voir les vraies adresses : il utilise donc le réseau de l'hôte.
  coturn:
    <<: *hardening
    profiles: ["remote"]
    image: coturn/coturn:4.19-alpine
    network_mode: host
    read_only: false
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?définir TURN_SECRET dans .env}
      - --realm=${SIGNALING_DOMAIN}
      - --external-ip=${PUBLIC_IP:?définir PUBLIC_IP dans .env}

networks:
  edge: {}
  backend:
    internal: true # pas d'accès Internet sortant pour la signalisation et ntfy

volumes:
  caddy_data: {}
  caddy_config: {}
  ntfy_data: {}
