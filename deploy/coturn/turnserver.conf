# Relais TURN du babyphone (phase 4).
# Le secret, le domaine et l'IP publique sont passés en ligne de commande depuis docker-compose.yml.

listening-port=3478
# Plage de ports relais réduite : à ouvrir à l'identique sur la box (UDP).
min-port=49160
max-port=49200

# Identifiants temporaires calculés par la signalisation (HMAC du secret partagé).
use-auth-secret
fingerprint

# Le relais ne doit jamais servir de rebond vers le réseau local ou le NAS lui-même.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas : une famille n'a besoin que de quelques sessions simultanées.
user-quota=4
total-quota=20
max-bps=2000000

no-cli
no-tcp-relay
no-software-attribute
log-file=stdout
simple-log
