name: Release

# Déclenché par un tag vX.Y.Z (ou vX.Y.Z-rc.N) poussé sur un commit de main. Voir docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ppierre89/babyphone-signaling

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Valider le tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag « $TAG » invalide : attendu vX.Y.Z ou vX.Y.Z-rc.N"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag doit pointer sur un commit de main"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          [ -n "${BASH_REMATCH[4]}" ] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write      # attestation de provenance
      attestations: write
    env:
      BABYPHONE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYPHONE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BABYPHONE_KEYSTORE_BASE64 absent : voir docs/RELEASING.md, section « Clé de signature »"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BABYPHONE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests et APK release signé
        working-directory: android
        env:
          BABYPHONE_KEYSTORE_PASSWORD: ${{ secrets.BABYPHONE_KEYSTORE_PASSWORD }}
          BABYPHONE_KEY_ALIAS: ${{ secrets.BABYPHONE_KEY_ALIAS }}
          BABYPHONE_KEY_PASSWORD: ${{ secrets.BABYPHONE_KEY_PASSWORD }}
        run: ./gradlew lint testDebugUnitTest assembleRelease

      - name: Vérifier la signature et nommer l'APK
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/signature.txt"
          mkdir -p dist
          cp "$apk" "dist/babyphone-$BABYPHONE_VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attestation de provenance de l'APK
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/babyphone-*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/
          retention-days: 7

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags : X.Y.Z, X.Y, et latest (sauf préversion).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server/signaling
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=signaling
          provenance: mode=max
          sbom: true

      - name: Attestation de provenance de l'image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [prepare, android, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: dist

      - name: Paquet de déploiement NAS et empreintes
        run: |
          sed -i "s/^SIGNALING_VERSION=.*/SIGNALING_VERSION=$VERSION/" deploy/.env.example
          tar -czf "dist/babyphone-deploy-$VERSION.tar.gz" --exclude=.env deploy
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          ## Installation

          - **Application** : \`babyphone-$VERSION.apk\` sur les deux téléphones.
          - **NAS** : image \`$IMAGE:$VERSION\` (amd64 et arm64). Dans \`deploy/.env\`, mettre \`SIGNALING_VERSION=$VERSION\` puis \`docker compose pull && docker compose up -d\`.

          ## Vérifier ce que vous installez

          \`\`\`bash
          sha256sum -c SHA256SUMS
          gh attestation verify babyphone-$VERSION.apk --repo $GITHUB_REPOSITORY
          gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY
          \`\`\`

          EOF
          sed -i 's/^          //' notes.md
          flags=(--verify-tag --generate-notes --notes-file notes.md --title "Babyphone $VERSION")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/*
