name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Cache Gradle (dépendances, build cache) : écrit sur main, en lecture seule sur les PR.
      # Vérifie aussi que le gradle-wrapper.jar commité est authentique.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Sur les PR : le minimum utile. Sur main : en plus le build release (R8), plus lent.
      - name: Lint, tests unitaires, APK debug
        run: ./gradlew lint testDebugUnitTest assembleDebug

      - name: Build release (R8)
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Android"
            echo "| Module | Tests | Échecs |"
            echo "| --- | --- | --- |"
            for f in $(find . -path '*test-results/testDebugUnitTest/*.xml'); do
              name=$(basename "$f" .xml | sed 's/^TEST-fr\.penpenic\.babyphone\.//')
              tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              fails=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              echo "| $name | $tests | $fails |"
            done
            apk=app/build/outputs/apk/debug/app-debug.apk
            [ -f "$apk" ] && echo "" && echo "APK debug : $(du -h "$apk" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: babyphone-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-android
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
