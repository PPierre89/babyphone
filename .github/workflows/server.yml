name: Serveur et déploiement

on:
  push:
    branches: [main]
    paths: ["server/**", "deploy/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "deploy/**", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  signaling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/signaling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/signaling/go.mod
          cache-dependency-path: server/signaling/go.sum

      - name: Formatage
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Analyse statique
        run: go vet ./...

      - name: Tests (détecteur de concurrence)
        run: go test -race -count=1 ./...

      - name: Vulnérabilités connues des dépendances
        uses: golang/govulncheck-action@v1
        with:
          work-dir: server/signaling
          go-version-file: server/signaling/go.mod

      - name: Image Docker
        run: docker build -t babyphone-signaling:ci .

  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Fichier .env de test
        run: |
          cp .env.example .env
          sed -i 's/^ALLOWED_FAMILIES=$/ALLOWED_FAMILIES=0123456789abcdef/; s/^TURN_SECRET=$/TURN_SECRET=ci/; s/^PUBLIC_IP=$/PUBLIC_IP=203.0.113.1/' .env

      - name: docker compose valide
        run: docker compose --env-file .env --profile remote config -q

      - name: Caddyfile valide
        run: |
          docker run --rm \
            -e SIGNALING_DOMAIN=a.example.fr -e PUSH_DOMAIN=b.example.fr -e ACME_EMAIL=ci@example.fr \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
